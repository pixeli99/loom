# MoE E32 L15 — ~1.69B total / ~0.63B activated.
#
# I=768, hidden=1280, L=15, heads 20/10 (head_dim=64).
# Same expert geometry as T_moe_L10: 30 routed + 2 shared, top_k=8 → 6r+2s.
# Expert width is 1.5× the L10 I=512; I=H=1280 would be ~2.63B (over 2B).

n_layers: 15

hidden_size: 1280
num_heads: 20
num_key_value_heads: 10

expansion: 4

ffn_type: moe

moe:
  expert_granularity: 8
  coarse_top_k: 1

  num_routed_experts: 30
  top_k: 8
  top_k_includes_shared: true
  num_shared_experts: 2

  shared_expert: true
  shared_expert_size_multiplier: 1

  expert_intermediate_size: 768

  gate_type: sigmoid
  router_dtype: float32
  load_balance_bias_lr: 2.0e-3
  router_z_loss_coef: 1.0e-3
  capacity_factor: 1.5
  router_per_loop: true
  router_loop_bias: false
  router_num_loops: 1

norm_type: pre
norm_eps: 1.0e-6

rope_theta: 10000.0
pos_emb_type: rope

init_type: lecun_normal
